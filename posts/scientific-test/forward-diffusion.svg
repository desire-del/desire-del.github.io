<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" role="img" aria-labelledby="title description">
  <title id="title">Forward diffusion schematic</title>
  <desc id="description">Four panels show a clean disk becoming obscured by increasing noise. This is a conceptual illustration, not a numerical simulation.</desc>
  <defs>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="1" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#475569"/>
    </marker>
    <g id="clean">
      <rect width="150" height="130" rx="4" fill="#e2e8f0"/>
      <circle cx="75" cy="65" r="35" fill="#334155"/>
    </g>
  </defs>
  <rect width="800" height="240" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#0f172a" text-anchor="middle">
    <text x="400" y="25" font-size="18">Forward diffusion: increasing noise</text>
    <g transform="translate(25 50)">
      <use href="#clean"/>
      <text x="75" y="155" font-size="15">Clean sample</text>
    </g>
    <g transform="translate(225 50)">
      <use href="#clean"/>
      <rect width="150" height="130" filter="url(#noise)" opacity="0.3"/>
      <text x="75" y="155" font-size="15">Low noise</text>
    </g>
    <g transform="translate(425 50)">
      <use href="#clean"/>
      <rect width="150" height="130" filter="url(#noise)" opacity="0.8"/>
      <text x="75" y="155" font-size="15">High noise</text>
    </g>
    <g transform="translate(625 50)">
      <rect width="150" height="130" fill="#e2e8f0"/>
      <rect width="150" height="130" filter="url(#noise)"/>
      <text x="75" y="155" font-size="15">Noise limit</text>
    </g>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <path d="M185 115 H215"/>
    <path d="M385 115 H415"/>
    <path d="M585 115 H615"/>
  </g>
</svg>
